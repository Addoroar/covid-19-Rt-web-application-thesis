{% extends "base.html" %}
{% block title %}Plot{% endblock %}
{% block content %}

<form action="{{ url_for('plot_rt.plot_data') }}" method="post" class="card control-panel">
  <div class="field">
    <label for="fstate">Rt for</label>
    <select name="fstate" id="fstate">
      {% for row in states_list %}
      <option {% if row == session.get('form_state') %}selected{% endif %}>{{ row }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="field">
    <label for="dfrom">From</label>
    <input type="date" name="dfrom" id="dfrom" value="{{ session.get('start_date', '2021-01-01') }}" min="2021-01-01" />
  </div>

  <div class="field">
    <label for="dto">To</label>
    <input type="date" name="dto" id="dto" value="{{ session.get('end_date', '2021-01-31') }}" />
  </div>

  <button type="submit" class="btn">Go</button>
</form>

<ul class="hint-list">
  <li>If the page fails to load please hit refresh</li>
  <li>The data will be displayed here shortly after you press "Go"</li>
  <li>The data will appear from the first available date</li>
</ul>

{% endblock %}
